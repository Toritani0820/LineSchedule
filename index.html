<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>読み込み中...</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">
  <div class="text-center">
    <div class="spinner-border text-primary mb-3" role="status"></div>
    <p id="loading-text" class="text-muted fw-bold">システムを起動中...</p>
  </div>

  <script src="config.js"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="common.js"></script>
  <script>
    window.onload = async function() {
      const loadingText = document.getElementById("loading-text");
      
      try {
        loadingText.innerText = "認証・ステータス確認中...";
        
        // common.js の共通ログイン・ステータス確認を実行
        const lineUserId = await initCommonApp();
        
        if (!lineUserId) {
          // LIFFログインのリダイレクト中などの場合はそのまま待機
          return;
        }

        const approvalStatus = localStorage.getItem('approvalStatus');

        // 承認済みの場合はスケジュール画面へ、未承認・未登録は申請画面へ遷移
        if (approvalStatus === "承認済") {
          window.location.replace("schedule.html");
        } else {
          window.location.replace("apply.html");
        }

      } catch (err) {
        console.error(err);
        loadingText.innerText = "エラーが発生しました: " + err.message;
      }
    };
  </script>
</body>
</html>
