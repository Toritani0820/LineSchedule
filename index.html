<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>読み込み中...</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">
  <div class="text-center">
    <div class="spinner-border text-primary mb-3" role="status"></div>
    <p id="loading-text" class="text-muted fw-bold">システムを起動中...</p>
  </div>

  <script src="config.js"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="common.js"></script>
  <script>
    window.onload = async function() {
      const loadingText = document.getElementById("loading-text");
      
      try {
        loadingText.innerText = "LIFFを初期化中...";
        await liff.init({ liffId: CONFIG.LIFF_ID });
        
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
  
        const profile = await liff.getProfile();
        loadingText.innerText = "ステータスを確認中...";
  
        // URL構築
        const url = `${CONFIG.GAS_WEB_APP_URL}?action=checkStatus&lineUserId=${encodeURIComponent(profile.userId)}`;
        
        // 通信処理
        const response = await fetch(url);
        const text = await response.text();
        
        let result;
        try {
          result = JSON.parse(text);
        } catch (e) {
          throw new Error("サーバーから不正なデータが返されました。");
        }
  
        // 結果による遷移
        if (result.status === "success") {
          // ここで result.registered が false なら未登録と判断
          if (result.registered && result.approvalStatus === "承認済") {
            window.location.replace("schedule.html");
          } else {
            window.location.replace("apply.html");
          }
        } else {
          throw new Error(result.message || "取得エラー");
        }
  
      } catch (err) {
        console.error(err);
        loadingText.innerText = "エラー: " + err.message;
      }
    };
  </script>
</body>
</html>
