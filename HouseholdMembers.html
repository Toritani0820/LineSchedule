<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>世帯メンバー管理</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- 共通ナビゲーションバー読み込み先 -->
  <div id="navbar-container"></div>

  <div class="container my-4">
    <h4 class="mb-4">世帯メンバー管理</h4>

    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="card-title fw-bold mb-3">所属メンバー一覧</h5>
        <div id="member-list-container">
          <p class="text-muted">読み込み中...</p>
        </div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="common.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    let currentUserLineUserId = "";

    document.addEventListener("DOMContentLoaded", initApp);

    async function initApp() {
      // 1. 他画面と同様に common.js の共通初期化を呼び出す
      currentUserLineUserId = await initCommonApp();
      if (!currentUserLineUserId) return;

      // 2. 認証・ヘッダー描画完了後に、世帯メンバー一覧を取得する
      loadHouseholdMembers();
    }

    async function loadHouseholdMembers() {
      const container = document.getElementById("member-list-container");
      try {
        const url = `${CONFIG.GAS_WEB_APP_URL}?action=getHouseholdMembers&lineUserId=${encodeURIComponent(currentUserLineUserId)}`;
        const response = await fetch(url);
        const result = await response.json();

        if (result.status === "success" && result.members) {
          if (result.members.length === 0) {
            container.innerHTML = `<p class="text-muted mb-0">メンバーが登録されていません。</p>`;
            return;
          }

          let html = `<ul class="list-group">`;
          result.members.forEach(m => {
            html += `
              <li class="list-group-item d-flex justify-content-between align-items-center">
                <div>
                  <strong>${escapeHTML(m.memberName || "名称未設定")}</strong>
                  <span class="badge bg-secondary ms-2">${escapeHTML(m.role || "閲覧者")}</span>
                </div>
                <small class="text-muted">${escapeHTML(m.approvalStatus || "")}</small>
              </li>
            `;
          });
          html += `</ul>`;
          container.innerHTML = html;
        } else {
          container.innerHTML = `<div class="alert alert-warning mb-0">${escapeHTML(result.message || "データの取得に失敗しました。")}</div>`;
        }
      } catch (err) {
        console.error("世帯メンバー取得エラー:", err);
        container.innerHTML = `<div class="alert alert-danger mb-0">通信エラーが発生しました。</div>`;
      }
    }
  </script>
</body>
</html>
