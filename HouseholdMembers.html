<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>世帯メンバー管理</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-light">

  <div id="navbar-container"></div>

  <div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="mb-0">世帯メンバー管理</h4>
      <div class="btn-group">
        <button id="btn-clear-school" class="btn btn-outline-danger btn-sm" style="display: none;" onclick="handleBatchClearSchool()">
          学校情報一括クリア
        </button>
        <button class="btn btn-primary btn-sm ms-2" onclick="openMemberModal()">+ メンバー追加</button>
      </div>
    </div>

    <div class="card mb-3 shadow-sm">
      <div class="card-body py-2">
        <div class="row align-items-center">
          <label for="selectHousehold" class="col-auto col-form-label fw-bold">対象世帯:</label>
          <div class="col">
            <select id="selectHousehold" class="form-select" onchange="loadMemberList()">
              <option value="">世帯を読み込み中...</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th>氏名</th>
                <th>よみ</th>
                <th>学校 / 学年 / クラス</th>
                <th>運用期間</th>
                <th class="text-end">操作</th>
              </tr>
            </thead>
            <tbody id="memberTableBody">
              <tr><td colspan="5" class="text-center py-3">データを読み込んでいます...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const GAS_WEB_APP_URL = "YOUR_GAS_WEB_APP_URL";
    const LIFF_ID = "YOUR_LIFF_ID";
    let currentUserLineUserId = "";

    document.addEventListener("DOMContentLoaded", initPage);

    async function initPage() {
      const navRes = await fetch("navbar.html");
      document.getElementById("navbar-container").innerHTML = await navRes.text();

      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login(); return; }
      const profile = await liff.getProfile();
      currentUserLineUserId = profile.userId;

      const res = await fetch(`${GAS_WEB_APP_URL}?action=getValidHouseholds&lineUserId=${encodeURIComponent(currentUserLineUserId)}`);
      const data = await res.json();

      if (data.status === "success") {
        updateNavigationUI(data.currentRole, profile.displayName);

        if (["システム管理者", "運用管理者"].includes(data.currentRole)) {
          document.getElementById("btn-clear-school").style.display = "inline-block";
        }

        const select = document.getElementById("selectHousehold");
        select.innerHTML = "";
        data.data.forEach(hh => {
          const opt = document.createElement("option");
          opt.value = hh.householdId;
          opt.textContent = hh.householdName;
          select.appendChild(opt);
        });

        loadMemberList();
      }
    }

    function loadMemberList() {}
    function handleBatchClearSchool() {}
  </script>
</body>
</html>
