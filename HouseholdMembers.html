<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>世帯メンバー管理</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div id="navbar-container"></div>

  <div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>世帯メンバー管理</h2>
      <button class="btn btn-primary fw-bold" onclick="openMemberModal()">＋ メンバー追加</button>
    </div>

    <!-- 対象世帯 選択・検索エリア -->
    <div class="card p-3 mb-4 shadow-sm">
      <div class="row g-3 align-items-end">
        <div class="col-md-9">
          <label class="form-label fw-bold">対象世帯</label>
          <select id="filterHouseholdId" class="form-select" disabled>
            <option value="">読み込み中...</option>
          </select>
        </div>
        <div class="col-md-3">
          <button class="btn btn-secondary w-100 fw-bold" onclick="loadHouseholdMembers()">🔍 検索</button>
        </div>
      </div>
    </div>

    <!-- 世帯メンバー一覧 エリア -->
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="card-title fw-bold mb-3">所属メンバー一覧</h5>
        <div class="table-responsive">
          <table class="table table-bordered align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th>氏名</th>
                <th>よみかた</th>
                <th>学校</th>
                <th>学年 / 組</th>
                <th>利用開始日</th>
                <th>運用終了日</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="memberTableBody">
              <tr><td colspan="7" class="text-center text-muted">対象世帯を選択して「検索」ボタンを押してください。</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- メンバー追加・編集モーダル -->
  <div class="modal fade" id="memberModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle">メンバー情報の登録</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="閉じる"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="editMemberId">

          <div class="mb-3">
            <label class="form-label fw-bold">氏名 <span class="text-danger">*</span></label>
            <input type="text" id="editMemberName" class="form-control" placeholder="例: 山田 太郎" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">よみかた</label>
            <input type="text" id="editMemberNameKana" class="form-control" placeholder="例: やまだ たろう">
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">学校名 / 所属</label>
            <input type="text" id="editSchoolName" class="form-control" list="schoolOptions" placeholder="選択または直接入力">
            <datalist id="schoolOptions"></datalist>
          </div>

          <div class="row g-2 mb-3">
            <div class="col-6">
              <label class="form-label fw-bold">学年</label>
              <input type="text" id="editGradeName" class="form-control" list="gradeOptions" placeholder="選択または直接入力">
              <datalist id="gradeOptions"></datalist>
            </div>
            <div class="col-6">
              <label class="form-label fw-bold">組・クラス</label>
              <input type="text" id="editSchoolYearClass" class="form-control" placeholder="例: 1組">
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">運用終了日</label>
            <input type="date" id="editEndDate" class="form-control">
            <div class="form-text">未入力の場合は無期限となります。</div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
          <button type="button" class="btn btn-success fw-bold" onclick="submitMemberSave()">保存する</button>
        </div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="common.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    let currentUserLineUserId = "";
    let currentUserRole = "";

    document.addEventListener("DOMContentLoaded", async () => {
      currentUserLineUserId = await initCommonApp();
      if (!currentUserLineUserId) return;

      await initializeHouseholdView();
    });

    async function initializeHouseholdView() {
      try {
        const url = `${CONFIG.GAS_WEB_APP_URL}?action=getValidHouseholds&lineUserId=${encodeURIComponent(currentUserLineUserId)}`;
        const response = await fetch(url);
        const result = await response.json();

        if (result && result.status === "success") {
          currentUserRole = result.currentRole;
          populateHouseholdDropdown(result.data, currentUserRole, result.currentHouseholdId);
        } else {
          alert("世帯情報の取得に失敗しました: " + (result ? result.message : ""));
        }
      } catch (err) {
        console.error("初期化エラー:", err);
        alert("通信エラーが発生しました。");
      }
    }

    function populateHouseholdDropdown(households, role, currentHouseholdId) {
      const selectEl = document.getElementById("filterHouseholdId");
      selectEl.innerHTML = "";
      const isGlobalAdmin = (role === "システム管理者" || role === "運用管理者");

      if (isGlobalAdmin) {
        const allOption = document.createElement("option");
        allOption.value = "";
        allOption.textContent = "すべての世帯";
        selectEl.appendChild(allOption);
      }

      if (households && households.length > 0) {
        households.forEach(hh => {
          const option = document.createElement("option");
          option.value = hh.householdId;
          option.textContent = `${hh.householdName}（${hh.householdId}）`;
          selectEl.appendChild(option);
        });
      }

      if (!isGlobalAdmin) {
        if (households && households.length === 1) {
          selectEl.value = households[0].householdId;
          selectEl.disabled = true;
          selectEl.classList.add("bg-light");
        } else if (households && households.length > 1) {
          selectEl.value = currentHouseholdId || households[0].householdId;
          selectEl.disabled = false;
          selectEl.classList.remove("bg-light");
        } else {
          selectEl.disabled = true;
        }
      } else {
        selectEl.disabled = false;
        selectEl.classList.remove("bg-light");
      }
    }

    async function loadHouseholdMembers() {
      const tbody = document.getElementById("memberTableBody");
      tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted">読み込み中...</td></tr>`;

      const targetHouseholdId = document.getElementById("filterHouseholdId").value;

      try {
        const url = `${CONFIG.GAS_WEB_APP_URL}?action=getHouseholdMembers&lineUserId=${encodeURIComponent(currentUserLineUserId)}&targetHouseholdId=${encodeURIComponent(targetHouseholdId)}`;
        const response = await fetch(url);
        const result = await response.json();

        if (result.status === "success") {
          const schoolDatalist = document.getElementById("schoolOptions");
          if (schoolDatalist && result.schools) {
            schoolDatalist.innerHTML = result.schools.map(s => `<option value="${escapeHTML(s.schoolName)}">`).join("");
          }

          const gradeDatalist = document.getElementById("gradeOptions");
          if (gradeDatalist && result.grades) {
            gradeDatalist.innerHTML = result.grades.map(g => `<option value="${escapeHTML(g.gradeName)}">`).join("");
          }

          const members = result.members || result.data || [];
          if (members.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted">該当する所属メンバーはいません。</td></tr>`;
            return;
          }

          tbody.innerHTML = "";
          members.forEach(m => {
            const tr = document.createElement("tr");
            const classInfo = [m.gradeName || m.gradeId, m.schoolYearClass].filter(Boolean).join(" / ") || "-";
            tr.innerHTML = `
              <td class="fw-bold">${escapeHTML(m.memberName || "未設定")}</td>
              <td>${escapeHTML(m.memberNameKana || "-")}</td>
              <td>${escapeHTML(m.schoolName || m.schoolId || "-")}</td>
              <td>${escapeHTML(classInfo)}</td>
              <td>${escapeHTML(m.startDate || "-")}</td>
              <td>${escapeHTML(m.endDate || "無期限")}</td>
              <td>
                <button class="btn btn-sm btn-outline-primary" onclick='openMemberModal(${JSON.stringify(m)})'>編集</button>
              </td>
            `;
            tbody.appendChild(tr);
          });
        } else {
          tbody.innerHTML = `<tr><td colspan="7" class="text-center text-info">${escapeHTML(result.message || "データの取得に失敗しました。")}</td></tr>`;
        }
      } catch (err) {
        console.error("メンバー取得エラー:", err);
        tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger">通信処理中にエラーが発生しました。</td></tr>`;
      }
    }

    function openMemberModal(item = null) {
      const targetHouseholdId = document.getElementById("filterHouseholdId").value;

      if (item) {
        document.getElementById("modalTitle").textContent = "メンバー情報の変更";
        document.getElementById("editMemberId").value = item.memberId || "";
        document.getElementById("editMemberName").value = item.memberName || "";
        document.getElementById("editMemberNameKana").value = item.memberNameKana || "";
        document.getElementById("editSchoolName").value = item.schoolName || item.schoolId || "";
        document.getElementById("editGradeName").value = item.gradeName || item.gradeId || "";
        document.getElementById("editSchoolYearClass").value = item.schoolYearClass || "";
        document.getElementById("editEndDate").value = item.endDate || "";
      } else {
        document.getElementById("modalTitle").textContent = "新規メンバーの登録";
        document.getElementById("editMemberId").value = "";
        document.getElementById("editMemberName").value = "";
        document.getElementById("editMemberNameKana").value = "";
        document.getElementById("editSchoolName").value = "";
        document.getElementById("editGradeName").value = "";
        document.getElementById("editSchoolYearClass").value = "";
        document.getElementById("editEndDate").value = "";
      }

      const modal = new bootstrap.Modal(document.getElementById("memberModal"));
      modal.show();
    }

    async function submitMemberSave() {
      const memberName = document.getElementById("editMemberName").value.trim();
      const targetHouseholdId = document.getElementById("filterHouseholdId").value;

      if (!memberName) {
        alert("氏名は必須入力項目です。");
        return;
      }

      const saveData = {
        action: "saveMember",
        lineUserId: currentUserLineUserId,
        memberData: {
          memberId: document.getElementById("editMemberId").value,
          memberName: memberName,
          memberNameKana: document.getElementById("editMemberNameKana").value.trim(),
          householdId: targetHouseholdId,
          schoolName: document.getElementById("editSchoolName").value.trim(),
          gradeName: document.getElementById("editGradeName").value.trim(),
          schoolYearClass: document.getElementById("editSchoolYearClass").value.trim(),
          endDate: document.getElementById("editEndDate").value
        }
      };

      try {
        const response = await fetch(CONFIG.GAS_WEB_APP_URL, {
          method: "POST",
          body: JSON.stringify(saveData),
          headers: { "Content-Type": "text/plain;charset=utf-8" }
        });
        const result = await response.json();

        if (result.status === "error") {
          alert("保存エラー: " + result.message);
          return;
        }

        alert(result.message || "保存が完了しました。");
        const modalEl = document.getElementById("memberModal");
        const modal = bootstrap.Modal.getInstance(modalEl);
        modal.hide();

        await loadHouseholdMembers();
      } catch (err) {
        console.error("保存エラー:", err);
        alert("保存処理に失敗しました。");
      }
    }
  </script>
</body>
</html>
