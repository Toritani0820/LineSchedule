<script>
  function updateNavigationUI(currentRole, memberName) {
    const nameEl = document.getElementById("nav-member-name");
    const roleEl = document.getElementById("nav-role");
    
    if (nameEl) nameEl.textContent = memberName || "ユーザー";
    if (roleEl) roleEl.textContent = currentRole || "閲覧者";

    const adminMenu = document.getElementById("nav-admin-menu");
    const userMaintItem = document.getElementById("li-user-maint");

    if (!adminMenu) return;

    const isGlobalAdmin = ["システム管理者", "運用管理者"].includes(currentRole);
    const isHouseholdAdmin = (currentRole === "世帯管理者");

    // 世帯管理者・全体管理者の場合、「管理メニュー」を表示
    if (isGlobalAdmin || isHouseholdAdmin) {
      adminMenu.classList.remove("d-none");
      
      if (userMaintItem) {
        if (isGlobalAdmin) userMaintItem.classList.remove("d-none");
        else userMaintItem.classList.add("d-none");
      }
    } else {
      adminMenu.classList.add("d-none");
    }
  }
</script>
