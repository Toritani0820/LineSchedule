<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スケジュール管理</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div id="navbar-container"></div>
  
  <div class="container my-4">
    <h2 class="mb-4">スケジュール管理</h2>
    
    <!-- メッセージ表示エリア -->
    <div id="app-message-box" class="d-none mb-3 p-3 rounded small"></div>

    <!-- 期間設定フィルターカード -->
    <div class="card p-3 mb-4 shadow-sm">
      <h5 class="fw-bold fs-6 mb-3">表示期間の指定</h5>
      <div class="row g-2 align-items-end">
        <div class="col-md-4">
          <label class="form-label small fw-bold">開始日</label>
          <input type="date" id="filterStartDate" class="form-control form-control-sm">
        </div>
        <div class="col-md-4">
          <label class="form-label small fw-bold">終了日</label>
          <input type="date" id="filterEndDate" class="form-control form-control-sm">
        </div>
        <div class="col-md-4">
          <button class="btn btn-sm btn-primary w-100 fw-bold py-2" onclick="loadEventsWithFilter()">期間を適用して表示</button>
        </div>
      </div>
    </div>

    <!-- スケジュール一覧表示カード -->
    <div class="card p-4 shadow-sm mb-4">
      <h5 class="fw-bold mb-3">スケジュール一覧</h5>
      <div id="events-container">
        <p class="text-muted">読み込み中...</p>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="common.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="schedule.js"></script>
</body>
</html>
