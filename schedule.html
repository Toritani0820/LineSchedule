<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スケジュール管理</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-light">

  <div id="navbar-container"></div>

  <div class="container my-4">
    <h4>スケジュール管理</h4>
    
    <div class="card mb-4 shadow-sm">
      <div class="card-body">
        <h6 class="card-title fw-bold mb-3">表示期間の指定</h6>
        <div class="row g-3 align-items-end">
          <div class="col-md-4">
            <label class="form-label small text-muted">開始日</label>
            <input type="date" id="startDate" class="form-control">
          </div>
          <div class="col-md-4">
            <label class="form-label small text-muted">終了日</label>
            <input type="date" id="endDate" class="form-control">
          </div>
          <div class="col-md-4">
            <button class="btn btn-primary w-100 fw-bold" onclick="loadSchedules()">期間を適用して表示</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="card-title fw-bold mb-3">スケジュール一覧</h5>
        <div id="schedule-list-content">
          <p class="text-muted mb-0">指定された期間のスケジュールはありません。</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const GAS_WEB_APP_URL = "YOUR_GAS_WEB_APP_URL";
    const LIFF_ID = "YOUR_LIFF_ID";

    document.addEventListener("DOMContentLoaded", initApp);

    async function initApp() {
      try {
        const navRes = await fetch("navbar.html");
        document.getElementById("navbar-container").innerHTML = await navRes.text();

        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) { liff.login(); return; }

        const profile = await liff.getProfile();
        const res = await fetch(`${GAS_WEB_APP_URL}?action=getValidHouseholds&lineUserId=${encodeURIComponent(profile.userId)}`);
        const data = await res.json();

        if (data.status === "success") {
          updateNavigationUI(data.currentRole, profile.displayName);
        }
      } catch (err) {
        console.error("初期化エラー:", err);
      }
    }

    function loadSchedules() {}
  </script>
</body>
</html>
